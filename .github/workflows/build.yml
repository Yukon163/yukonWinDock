name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        run: dotnet test yukonWinDock.sln -c Release --nologo
      - name: Publish portable application
        run: dotnet publish src/YukonWinDock/YukonWinDock.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: yukonWinDock-win-x64
          path: artifacts/win-x64/yukonWinDock.exe
